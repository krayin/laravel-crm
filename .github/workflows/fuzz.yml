name: Fuzz Tests

on:
  push:
    branches: ['2.2']

  pull_request:

  schedule:
    - cron: '0 2 * * 1'

  workflow_dispatch:
    inputs:
      seed:
        description: 'FUZZ_SEED to reproduce a run (blank for the default seed)'
        required: false
      iterations:
        description: 'Random strings per input (FUZZ_ITERATIONS)'
        required: false
        default: '5'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    name: Pest fuzz suite

    # Report-only until the known findings are fixed; remove so new crashes fail the build.
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: krayin
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set testing environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${{ job.services.mysql.ports['3306'] }}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1krayin|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env

      - name: Run Krayin installer
        run: php artisan krayin-crm:install --skip-env-check --skip-admin-creation

      - name: Run fuzz tests
        env:
          FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || inputs.seed }}
          FUZZ_ITERATIONS: ${{ github.event_name == 'schedule' && '50' || inputs.iterations || '5' }}
        run: vendor/bin/pest --parallel --group=fuzz --colors=always --log-junit fuzz-report.xml

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report
          path: fuzz-report.xml
          retention-days: 14
