name: Tests (BrandKit)

on:
  pull_request:
    paths:
      - "app/Support/**"
      - "app/Services/**"
      - "app/Models/BrandKit*"
      - "tests/Unit/BrandKit*"
      - "tests/Unit/PreviewSession*"
      - "tests/Unit/ThemeContext*"
      - "tests/Traits/BrandKitTestSchema.php"
      - "resources/views/vendor/theme-manager/**"
      - "packages/Webkul/ThemeManager/**"
      - ".github/workflows/tests.yml"
      - "composer.json"
      - "composer.lock"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-brandkit:
    name: Pest (BrandKit/Theme)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-php82-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php82-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        run: |
          cp .env.example .env || true
          php artisan key:generate || true
        env:
          APP_ENV: testing

      - name: Run tests (BrandKit)
        run: composer test:brandkit
        env:
          APP_ENV: testing
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
