; =============================================================================
; Krayin CRM - OPcache Configuration
; Optimized for production Laravel applications
; =============================================================================

[opcache]
; Enable OPcache
opcache.enable=1
opcache.enable_cli=1

; Memory consumption
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; Revalidation (0 = never check for changes - best for production)
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.revalidate_path=0

; Fast shutdown
opcache.fast_shutdown=1

; Save comments (required for Laravel annotations)
opcache.save_comments=1
opcache.load_comments=1

; Optimization level
opcache.optimization_level=0x7FFFBFFF

; JIT (PHP 8.0+)
opcache.jit_buffer_size=128M
opcache.jit=1255

; Error handling
opcache.error_log=/var/log/php/opcache.log
opcache.log_verbosity_level=1

; File cache (for persistent caching across restarts)
opcache.file_cache=/var/cache/php/opcache
opcache.file_cache_only=0
opcache.file_cache_consistency_checks=1

; Preloading (Laravel specific)
; Uncomment after running: php artisan optimize
; opcache.preload=/var/www/html/bootstrap/cache/opcache.php
; opcache.preload_user=krayin

; Huge pages (if available on host)
; opcache.huge_code_pages=1
