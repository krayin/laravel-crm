; =============================================================================
; Krayin CRM - PHP-FPM Pool Configuration
; =============================================================================

[www]
; User/Group
user = krayin
group = krayin

; Listen
listen = 9000
listen.owner = krayin
listen.group = krayin
listen.mode = 0660
listen.allowed_clients =

; Process Manager
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500
pm.process_idle_timeout = 10s

; Status
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Request
request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /var/log/php/slow.log

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Security
security.limit_extensions = .php

; Environment variables
clear_env = no

; Resource limits
rlimit_files = 65535
rlimit_core = 0

; Access log (disabled in production for performance)
; access.log = /var/log/php/access.log
; access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
